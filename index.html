<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dr. Levure — Escape Room Boulangerie</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: Arial, Helvetica, sans-serif;
    background: #3D1F0A;
    color: #FFF8F0;
    overflow-x: hidden;
    min-height: 100vh;
  }
  /* Kraft paper grain texture using layered SVG noise */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    opacity: 0.35;
    mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.55  0 0 0 0 0.32  0 0 0 0 0.14  0 0 0 0.9 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.55'/></svg>");
  }
  /* Bakery photo — discreet normally, vivid on intro */
  .bakery-bg {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    background-image: url("https://images.unsplash.com/photo-1509440159596-0249088772ff?auto=format&fit=crop&w=1920&q=80");
    background-size: cover;
    background-position: center 30%;
    opacity: 0.14;
    filter: sepia(0.45) saturate(0.8) brightness(0.85) contrast(1.05);
    transition: opacity 0.6s ease, filter 0.6s ease;
  }
  /* Class applied only during intro screen */
  .bakery-bg.intro-visible {
    opacity: 0.72;
    filter: sepia(0.55) saturate(0.75) brightness(0.65) contrast(1.1);
  }
  .bakery-bg::after {
    content: "";
    position: absolute;
    inset: 0;
    background:
      linear-gradient(180deg,
        rgba(30,12,3,0.55) 0%,
        rgba(61,31,10,0.18) 35%,
        rgba(61,31,10,0.18) 60%,
        rgba(20,8,2,0.82) 100%),
      radial-gradient(ellipse 80% 50% at 50% 0%,
        rgba(212,168,83,0.22) 0%,
        transparent 65%);
  }
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    background: radial-gradient(ellipse at 50% 0%, rgba(212,168,83,0.05), transparent 55%),
                radial-gradient(ellipse at 50% 100%, rgba(0,0,0,0.55), transparent 70%);
  }
  #root { position: relative; z-index: 1; min-height: 100vh; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: #2A1505; }
  ::-webkit-scrollbar-thumb { background: #5C2E10; border-radius: 5px; }
  ::-webkit-scrollbar-thumb:hover { background: #8B4513; }

  /* Pulse animation for alert badge */
  @keyframes pulseAlert {
    0%, 100% {
      transform: scale(1);
      box-shadow: 0 0 0 0 rgba(204,0,0,0.7), 0 6px 20px rgba(0,0,0,0.5);
    }
    50% {
      transform: scale(1.04);
      box-shadow: 0 0 0 14px rgba(204,0,0,0), 0 6px 20px rgba(0,0,0,0.5);
    }
  }

  /* Shimmer for active padlock */
  @keyframes shimmer {
    0%, 100% { box-shadow: 0 0 0 0 rgba(212,168,83,0.5), 0 10px 30px rgba(0,0,0,0.35); border-color: #D4A853; }
    50% { box-shadow: 0 0 0 8px rgba(212,168,83,0), 0 14px 36px rgba(0,0,0,0.4); border-color: #E9BE6A; }
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes parallaxIn {
    from { opacity: 0; transform: translateY(20px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* Standardized screen fade-in (300ms opacity-only) */
  @keyframes screenFade {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  /* Verify button shake (rejected invalid click) */
  @keyframes shakeButton {
    0%, 100% { transform: translate(0); }
    20% { transform: translate(-6px); }
    40% { transform: translate(6px); }
    60% { transform: translate(-4px); }
    80% { transform: translate(4px); }
  }
  .shake-btn { animation: shakeButton 0.52s ease; }

  /* Global button hover lift (skips disabled and explicit opt-outs) */
  button { transition: transform 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease, background 0.2s ease, color 0.2s ease; }
  button:not(:disabled):not(.no-lift):hover { transform: translateY(-2px); filter: brightness(1.04); }
  button:not(:disabled):not(.no-lift):active { transform: translateY(0); filter: brightness(0.98); }

  /* Drag visual reinforcement */
  .levure-dragging { box-shadow: 0 16px 32px rgba(0,0,0,0.45), 0 4px 12px rgba(0,0,0,0.25) !important; cursor: grabbing !important; }

  @keyframes clockTick {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.05); opacity: 0.55; }
  }

  /* Shake for wrong drop */
  @keyframes shakeWrong {
    0%, 100% { transform: translate(0, 0); }
    15% { transform: translate(-6px, 0) rotate(-2deg); }
    30% { transform: translate(6px, 0) rotate(2deg); }
    45% { transform: translate(-5px, 0) rotate(-1.5deg); }
    60% { transform: translate(5px, 0) rotate(1.5deg); }
    75% { transform: translate(-3px, 0); }
    90% { transform: translate(3px, 0); }
  }
  .shake-wrong { animation: shakeWrong 0.55s ease-in-out; }

  /* Pulse on correct drop */
  @keyframes correctPop {
    0% { transform: scale(0.8); opacity: 0; }
    60% { transform: scale(1.08); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }

  /* Drop-zone pulse when drag is hovering */
  @keyframes zonePulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(212,168,83,0.55); }
    50% { box-shadow: 0 0 0 10px rgba(212,168,83,0); }
  }

  /* Balance beam tilt */
  @keyframes beamWobble {
    0%, 100% { transform: rotate(0deg); }
    25% { transform: rotate(2deg); }
    50% { transform: rotate(-1.5deg); }
    75% { transform: rotate(1deg); }
  }

  /* Flour confetti fall */
  @keyframes flourFall {
    0% { transform: translate(0, -20px) rotate(0deg); opacity: 0; }
    10% { opacity: 1; }
    100% { transform: translate(var(--dx, 0px), 120vh) rotate(720deg); opacity: 0; }
  }

  /* Victory trophy entry */
  @keyframes victoryTrophy {
    0% { transform: scale(0.4) rotate(-20deg); opacity: 0; }
    60% { transform: scale(1.15) rotate(8deg); opacity: 1; }
    100% { transform: scale(1) rotate(0deg); opacity: 1; }
  }

  /* Lock cascade fade-up */
  @keyframes lockCascade {
    0% { opacity: 0; transform: translateY(14px) scale(0.85); }
    60% { transform: translateY(-3px) scale(1.05); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* FERMÉ sign sway */
  @keyframes ferméSwing {
    0%, 100% { transform: rotate(-5deg); }
    50% { transform: rotate(-7deg); }
  }

  /* Badge subtle shine */
  @keyframes badgeShine {
    0%, 100% { box-shadow: inset 0 -4px 8px rgba(0,0,0,0.25), 0 6px 16px rgba(0,0,0,0.3), 0 0 0 0 rgba(255,235,180,0.5); }
    50% { box-shadow: inset 0 -4px 8px rgba(0,0,0,0.25), 0 6px 16px rgba(0,0,0,0.3), 0 0 22px 4px rgba(255,235,180,0.55); }
  }

  /* Subtle wood grain for workbench */
  .workbench-bg {
    background:
      repeating-linear-gradient(135deg,
        rgba(139,69,19,0.06) 0,
        rgba(139,69,19,0.06) 2px,
        transparent 2px,
        transparent 9px),
      #FFF8F0;
  }
</style>
<!-- React + Babel -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div class="bakery-bg" aria-hidden="true"></div>
<div id="root"></div>
<!-- Bundler thumbnail (used as splash by the offline bundler) -->
<template id="__bundler_thumbnail">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
    <rect width="200" height="200" fill="#3D1F0A"/>
    <g transform="translate(100,100)" fill="none" stroke="#D4A853" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-32 4 V-8 a32 32 0 0 1 64 0 V4" />
      <rect x="-42" y="4" width="84" height="56" rx="6" fill="#D4A853" stroke="#D4A853"/>
      <circle cx="0" cy="28" r="6" fill="#3D1F0A" stroke="none"/>
      <rect x="-3" y="32" width="6" height="14" rx="2" fill="#3D1F0A" stroke="none"/>
    </g>
    <text x="100" y="180" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#D4A853" font-style="italic">Dr. Levure</text>
  </svg>
</template>
<script src="scorm-api.js"></script>
<script type="text/babel" src="app.jsx"></script>
</body>
</html>
